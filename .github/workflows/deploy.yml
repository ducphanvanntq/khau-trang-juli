# Deploy site tĩnh lên Cloudflare Pages
# - Push lên main        -> deploy bản chính (production)
# - Pull request / nhánh -> deploy bản xem trước (preview), có URL riêng
# Cần 2 secret trong GitHub repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT_NAME: khau-trang-juli-duc-cuong
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gom file website vào thư mục dist
        run: |
          mkdir dist
          cp -r *.html css js images assets dist/

      - name: Deploy
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch="$BRANCH" --commit-hash="$GITHUB_SHA"
